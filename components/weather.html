<!-- ১. বর্তমান আবহাওয়া (আপনার যা আছে তাই থাকবে) -->
<div class="weather-card">
    <div class="weather-header">
        <span class="location-name">📍 কলকাতা</span> <!-- পরে এটি অটোমেটিক হবে -->
        <span class="weather-icon" id="w-icon">⛅</span>
    </div>
    <div class="weather-body">
        <h2 id="w-temp">--°C</h2>
        <p id="w-desc">তথ্য লোড হচ্ছে...</p>
    </div>
    <div class="weather-footer">
        <span>বাতাস: <span id="w-wind">--</span> km/h</span>
    </div>
</div>

<!-- ২. নতুন সংযোজন: আগামী ৫ দিনের পূর্বাভাস -->
<div class="forecast-container">
    <h3 class="forecast-title">📅 আগামী ৫ দিনের পূর্বাভাস</h3>
    <div id="forecast-list">
        <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে লিস্ট লোড হবে -->
        <p style="text-align:center; color:#888;">লোড হচ্ছে...</p>
    </div>
</div>
