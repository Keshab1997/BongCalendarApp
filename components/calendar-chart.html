<div class="chart-wrapper">
    <!-- ১. নেভিগেশন হেডার -->
    <div class="chart-header">
        <button id="prev-month-btn">❮</button>
        <h3 id="current-month-display">...</h3>
        <button id="next-month-btn">❯</button>
    </div>

    <!-- ২. বারের নাম (রবিবার লাল রঙের করা হয়েছে) -->
    <div class="weekdays-grid">
        <div style="color: #d32f2f;">রবি</div> <!-- রবিবার লাল -->
        <div>সোম</div>
        <div>মঙ্গল</div>
        <div>বুধ</div>
        <div>বৃহঃ</div>
        <div>শুক্র</div>
        <div>শনি</div>
    </div>

    <!-- ৩. তারিখের গ্রিড (JS দিয়ে লোড হবে) -->
    <div id="days-grid" class="days-grid"></div>
</div>

<!-- ৪. পপ-আপ মোডাল (শুরুতে লুকানো থাকবে) -->
<div id="event-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <!-- পপ-আপের ভেতরের তথ্য -->
        <h2 id="modal-date">...</h2>
        <h4 id="modal-bn-date">...</h4>
        
        <div class="modal-divider"></div>
        
        <p id="modal-event-name">...</p>
    </div>
</div>
