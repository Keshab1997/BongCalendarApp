<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bong Calendar App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/nav.css">
    <!-- অন্যান্য CSS ফাইলগুলো যেমন আছে থাকুক -->
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/calendar-chart.css">
    <link rel="stylesheet" href="css/weather.css">
    <link rel="stylesheet" href="css/news.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <div id="header-container"></div>

    <!-- মেইন কন্টেন্ট এরিয়া -->
    <main id="main-content" style="padding-bottom: 80px;">
        
        <!-- ১. আজকের ভিউ -->
        <div id="view-today">
            <div id="calendar-container"></div>
        </div>

        <!-- ২. চার্ট ভিউ -->
        <div id="view-chart" style="display: none;">
            <div id="chart-container"></div>
        </div>

        <!-- ৩. আবহাওয়া ভিউ -->
        <div id="view-weather" style="display: none;">
            <div id="weather-container"></div>
        </div>

        <!-- ৪. নিউজ ভিউ -->
        <div id="view-news" style="display: none;">
            <div id="news-container"></div>
        </div>

    </main>

    <!-- পরিবর্তন: এখানে সরাসরি nav.html এর কোড বসানো হলো -->
    <nav class="bottom-nav">
        <!-- ১. আজ -->
        <button id="btn-today" class="nav-item active-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
            <span>আজ</span>
        </button>

        <!-- ২. চার্ট -->
        <button id="btn-chart" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            <span>মাসিক</span>
        </button>

        <!-- ৩. আবহাওয়া -->
        <button id="btn-weather" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.1-1.2-.6-2.3-1.4-3.1-1.3-1.3-3.4-1.3-4.7 0-1.3 1.3-1.3 3.4 0 4.7 0 .1.1.2.1.3L7 18c-.6 0-1.1.4-1.1 1s.5 1 1.1 1h10.5c1.7 0 3-1.3 3-3z"></path><path d="M13 10V3"></path><path d="M8 5l2 2"></path><path d="M18 5l-2 2"></path></svg>
            <span>আবহাওয়া</span>
        </button>

        <!-- ৪. খবর -->
        <button id="btn-news" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>
            <span>খবর</span>
        </button>
    </nav>

    <!-- JS Files -->
    <script src="js/ui.js"></script> 
    <script src="js/weather.js"></script>
    <script src="js/calendar-chart.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/news.js"></script>
    <script src="js/nav.js"></script>
    
    <!-- App.js সবার শেষে -->
    <script src="js/app.js"></script>

</body>
</html>
